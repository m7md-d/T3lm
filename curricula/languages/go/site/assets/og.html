<!doctype html>
<!-- بطاقة المشاركة: رأس الشريحة — ثلاث كلماتٍ بعناوينها، ووحدة العرض في هذا
     الموقع كلمةُ الآلة (٨ بايت). المصدر: جدول الاشتقاق §«الوحدة البصرية». -->
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="../public/fonts/fonts.css">
<style>
  :root{--bg:#0a0d11;--surface:#11161c;--line:#212b36;--ink:#d8e0e8;--dim:#8f9dac;
        --faint:#5b6a7a;--cyan:#4bc4e8}
  *{margin:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:var(--bg);color:var(--ink);
       font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;padding:64px 72px;
       display:flex;flex-direction:column;justify-content:center;gap:36px}
  h1{font-size:72px;font-weight:700;letter-spacing:-1px}
  h1 .go{font-family:'JetBrains Mono',ui-monospace,monospace;font-weight:800;font-size:64px;
         color:var(--cyan);padding-left:22px;direction:ltr;unicode-bidi:isolate}
  p{font-size:28px;color:var(--dim);font-weight:400;max-width:920px;line-height:1.65}
  .words{direction:ltr;display:flex;gap:2px;font-family:'JetBrains Mono',ui-monospace,monospace}
  .w{flex:1;background:var(--surface);border:1px solid var(--line);padding:18px 20px}
  .w:first-child{border-inline-start:3px solid var(--cyan)}
  .w b{display:block;font-size:24px;font-weight:500;color:var(--ink)}
  .w i{display:block;font-size:17px;font-style:normal;color:var(--faint);margin-top:6px}
  .foot{display:flex;align-items:center;gap:16px;font-size:22px;color:var(--faint);
        font-family:'JetBrains Mono',ui-monospace,monospace;direction:ltr}
  .dot{width:9px;height:9px;background:var(--cyan);border-radius:50%}
</style></head><body>
  <h1><span class="go">Go</span>من الجذور</h1>
  <p>تفكيك اللغة من نظام أنواعها إلى تمثيلها في الذاكرة — لمن يعرف C.</p>
  <div class="words">
    <div class="w"><b>ptr</b><i>0x14000a · 8 bytes</i></div>
    <div class="w"><b>len</b><i>3 · 8 bytes</i></div>
    <div class="w"><b>cap</b><i>4 · 8 bytes</i></div>
  </div>
  <div class="foot"><span class="dot"></span><span>go.nodeksa.com</span></div>
</body></html>
