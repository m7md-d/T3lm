<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- الرمز مشتقّ من المحتوى: `&` هو عامل الاستعارة، ومحور المنهج كلّه. -->
  <rect width="64" height="64" rx="6" fill="#100c0a"/>
  <text x="32" y="45" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, monospace"
        font-size="42" font-weight="700" fill="#e07a3f">&amp;</text>
</svg>
