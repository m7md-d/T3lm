<!doctype html>
<!-- الأيقونة: البديهية الأولى — ما تكتبه أنت على وَرَقٍ دافئ، وما يبقى بعد
     الترجمة على أرضٍ باردة، **والحدُّ بينهما هو المترجم** فبلونه.
     المصدر: جدول الاشتقاق §«الأرضيّتان». -->
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:100%;height:100%;background:#020403;display:grid;place-items:center}
  svg{width:100%;height:100%}
</style></head><body>
<svg viewBox="-96 -96 704 704" xmlns="http://www.w3.org/2000/svg">
  <rect x="-96" y="-96" width="704" height="704" fill="#020403"/>
  <rect width="248" height="512" fill="#000000"/>
  <rect x="248" width="16" height="512" fill="#3ee87b"/>

  <!-- الوَرَق: سطران ممّا تكتب -->
  <g fill="#d9e6dc">
    <rect x="300" y="180" width="164" height="22"/>
    <rect x="300" y="240" width="112" height="22"/>
    <rect x="300" y="300" width="140" height="22"/>
  </g>

  <!-- الأرض الباردة: أربعة بايتات ممّا يبقى -->
  <g fill="#c9dc4b">
    <rect x="48" y="228" width="34" height="34"/>
    <rect x="98" y="228" width="34" height="34"/>
    <rect x="148" y="228" width="34" height="34"/>
    <rect x="198" y="228" width="34" height="34" opacity=".45"/>
  </g>
</svg>
</body></html>
