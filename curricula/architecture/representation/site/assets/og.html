<!doctype html>
<meta charset="utf-8" />
<!-- بطاقة المشاركة: العلامة والعنوان وسؤال المنهج الثابت. -->
<link rel="stylesheet" href="../public/fonts/fonts.css" />
<style>
  html, body { margin: 0; height: 100%; }
  body {
    width: 1200px; height: 630px;
    display: flex; flex-direction: column; justify-content: center;
    gap: 26px; padding: 0 92px; box-sizing: border-box;
    font-family: 'Readex Pro', system-ui, sans-serif;
    direction: rtl;
    color: #dfe3ea;
    background: #0c0e13;
    background-image: radial-gradient(80% 60% at 50% -8%, #14171f 0%, #08090d 70%);
  }
  svg { width: 168px; height: 70px; }
  h1 { margin: 0; font-size: 62px; font-weight: 600; line-height: 1.25; }
  p { margin: 0; font-size: 30px; color: #a4adbb; max-width: 24ch; line-height: 1.6; }
  .who { display: flex; gap: 22px; font-size: 22px; direction: ltr; }
  .who span { padding: 4px 16px; border-radius: 999px; border: 1px solid #262c38; }
  .g1 { color: #45c9c0; } .g2 { color: #8f9df0; } .g3 { color: #e0a94a; } .g4 { color: #d9808f; }
</style>
<svg viewBox="0 0 48 20" fill="none" stroke="#45c9c0" stroke-width="1.5">
  <rect x="0.75" y="3.75" width="16.5" height="12.5" />
  <line x1="18" y1="10" x2="30" y2="10" />
  <rect x="30.75" y="3.75" width="16.5" height="12.5" />
</svg>
<h1>التمثيل</h1>
<p>ملفٌّ يمرّ، ومعناه مستحيل. فمن كان يفترض أن يمنع ذلك؟</p>
<div class="who">
  <span class="g1">@grammar</span>
  <span class="g2">@validator</span>
  <span class="g3">@solver</span>
  <span class="g4">@convention</span>
</div>
