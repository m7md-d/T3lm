<!doctype html>
<meta charset="utf-8" />
<!--
  بطاقة المشاركة: العلامةُ المشتقّة، والعنوانُ بخطّ الموقع نفسه المستضاف محلياً.
  والشريطُ أسفلَها **سلَّمُ التغطية** — نفسُ موتيف الموقع، وقيمُه هي القيم.
-->
<link rel="stylesheet" href="../public/fonts/fonts.css" />
<style>
  html, body { margin: 0; height: 100%; }
  body {
    width: 1200px; height: 630px;
    box-sizing: border-box;
    padding: 76px 84px;
    display: flex; flex-direction: column; justify-content: space-between;
    background: #0d0d0d;
    color: #ededed;
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    direction: rtl;
  }
  svg.mark { width: 68px; height: 68px; color: #ededed; }
  h1 { font-size: 62px; line-height: 1.25; margin: 0; font-weight: 700; }
  p { font-size: 27px; line-height: 1.6; margin: 18px 0 0; color: #cecece; max-width: 26ch; }
  .ramp { display: flex; gap: 2px; width: 340px; }
  .ramp i { display: block; flex: 1; height: 42px; background: #ffffff; }
  .foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
  .host { font-family: 'JetBrains Mono', monospace; direction: ltr; color: #a0a0a0; font-size: 22px; }
</style>
<svg class="mark" viewBox="0 0 24 24">
  <polygon points="3,15.5 21,7.5 21,21 3,21" fill="currentColor" opacity="0.55" />
  <rect x="3" y="3" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" opacity="0.4" />
  <circle cx="12" cy="12" r="1.7" fill="currentColor" />
</svg>
<div>
  <h1>من المسار إلى البكسل</h1>
  <p>الملء والخطّ والتركيب واللون — بـC، وكلُّ صورةٍ مقيسة</p>
</div>
<div class="foot">
  <span class="host">path-to-pixel.nodeksa.com</span>
  <span class="ramp">
    <i style="opacity:1"></i><i style="opacity:.78"></i><i style="opacity:.55"></i>
    <i style="opacity:.34"></i><i style="opacity:.17"></i><i style="opacity:.06"></i>
  </span>
</div>
